{{define "layout"}}<!doctype html>
<html lang="fr" data-theme="cpp">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noai, noimageai">
<title>{{.Title}} · {{if .Admin}}SOS CPP Comité{{else}}SOS CPP{{end}}</title>
<link rel="preload" href="/static/fonts/atkinson-hyperlegible-next-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{static "app.css"}}">
{{block "head" .}}{{end}}
</head>
<body class="min-h-dvh bg-base-100 font-sans text-base-content antialiased">
{{block "nav" .}}{{end}}
<main class="mx-auto w-full px-4 pt-6 pb-12 {{if .Admin}}max-w-5xl{{else}}max-w-160{{end}}">
{{range .Notices}}{{template "notice" .}}{{end}}
{{template "main" .}}
</main>
</body>
</html>{{end}}

{{define "notice"}}<div role="{{if eq .Kind "error"}}alert{{else}}status{{end}}" class="alert alert-soft mb-4 {{if eq .Kind "error"}}alert-error{{else if eq .Kind "warning"}}alert-warning{{else if eq .Kind "success"}}alert-success{{else}}alert-info{{end}}">
<span>{{.Text}}{{if .Link}} <a class="link font-semibold" href="{{.Link}}">{{.LinkText}}</a>{{end}}</span>
</div>{{end}}
