{{/* Committee assistant partials (design 2026-10-08), shared by /assistant and the request page. app.js clones assistantExchange from a <template> and fills it from the stream. */}}

{{define "assistantThread"}}<ol class="flex flex-col gap-8" data-assistant-thread aria-live="polite">{{range .}}{{template "assistantExchange" .}}{{end}}</ol>{{end}}

{{define "assistantExchange"}}<li class="flex flex-col gap-3" data-exchange>
<p class="ml-auto max-w-[85%] rounded-box rounded-br-sm bg-primary px-4 py-3 whitespace-pre-wrap break-words text-primary-content" data-question>{{.Question}}</p>
<div class="flex min-w-0 flex-col gap-2">
<details class="text-sm text-base-content/80" data-steps-box{{if not .Answer}} open{{end}}>
<summary class="inline-flex min-h-11 cursor-pointer items-center gap-2" data-steps-summary>{{if .Steps}}{{plural (len .Steps) "donnée consultée" "données consultées"}}{{else if .Answer}}Aucune donnée consultée{{else}}Recherche en cours…{{end}}</summary>
<ul class="flex flex-col gap-1 border-l-2 border-base-300 pl-3" data-steps>{{range .Steps}}<li>{{.}}</li>{{end}}</ul>
</details>
<div class="answer" data-answer>{{.Answer}}</div>
<p role="alert" class="alert alert-soft alert-error" data-error hidden></p>
<div class="flex flex-wrap gap-2" data-sources>{{template "assistantSources" .Sources}}</div>
</div>
</li>{{end}}

{{define "assistantSources"}}{{range .}}{{if .Link}}<a class="badge badge-outline min-h-8 gap-1" href="{{.Link}}">{{.Label}}</a>{{else}}<span class="badge min-h-8 {{if .Stale}}badge-soft badge-warning{{else}}badge-outline{{end}}">{{.Label}}{{with .Date}} · {{.}}{{end}}{{if .Stale}} · périmé{{end}}</span>{{end}}{{end}}{{end}}

{{define "assistantDossier"}}{{if or .People .Sources}}
{{with .People}}<h3 class="mt-4 text-sm font-semibold text-primary">Adhérents</h3>
<ul class="mt-2 flex flex-col gap-3">{{range .}}<li>
<p class="font-semibold">{{.Name}}{{if gt .Shared 1}} <span class="badge badge-soft badge-warning">Homonyme</span>{{end}}</p>
{{if .Email}}<p class="text-sm break-all">{{.Email}}</p>
<p class="text-sm">Saisons : {{.Seasons}} · licence : {{.Licence}}</p>
{{else}}<p class="text-sm">Connu par la campagne d'adhésion seulement</p>{{end}}
{{if and .Email (gt .Shared 1)}}<button type="button" class="btn btn-outline btn-sm mt-1 min-h-11" data-pick="Je parle de {{.Ref}} ({{.Name}}).">C'est cette personne</button>{{end}}
</li>{{end}}</ul>{{end}}
{{with .Sources}}<h3 class="mt-4 text-sm font-semibold text-primary">Données consultées</h3>
<ul class="mt-2 flex flex-col gap-1 text-sm">{{range .}}<li>{{if .Link}}<a class="link link-primary" href="{{.Link}}">{{.Label}}</a>{{else}}{{.Label}} · {{.Date}}{{if .Stale}} <span class="badge badge-soft badge-warning">périmé</span>{{end}}{{end}}</li>{{end}}</ul>{{end}}
{{else}}<p class="mt-3 text-sm text-base-content/80">Les adhérents trouvés et les données lues s'affichent ici, avec la date de leur import.</p>{{end}}
<p class="mt-4 border-t border-base-300 pt-3 text-sm text-base-content/80" data-assistant-remaining>{{.Remaining}}</p>
{{with .Expires}}<p class="text-sm text-base-content/80">{{.}}</p>{{end}}{{end}}

{{define "assistantComposer"}}<form method="post" action="/assistant/messages" class="flex flex-col gap-2 border-t border-base-300 bg-base-100 p-3" data-assistant-form>
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label class="sr-only" for="assistant-text-{{.TicketID}}">Ta question, ou le message d'un adhérent</label>
<textarea class="textarea max-h-[40dvh] w-full resize-none" id="assistant-text-{{.TicketID}}" name="text" rows="2" maxlength="8000" placeholder="Colle le message d'un adhérent ou pose ta question"></textarea>
<div class="flex items-center justify-between gap-3">
<div class="flex min-w-0 flex-col gap-1">
<p class="text-sm text-base-content/80" data-assistant-remaining>{{.Remaining}}</p>
<p class="hidden text-sm text-base-content/80 pointer-fine:block"><kbd class="kbd kbd-sm">Entrée</kbd> pour envoyer, <kbd class="kbd kbd-sm">Maj</kbd> + <kbd class="kbd kbd-sm">Entrée</kbd> pour aller à la ligne</p>
</div>
<button class="btn btn-primary min-h-11" type="submit" data-assistant-send><span data-label-send>Envoyer</span><span data-label-stop hidden>Arrêter</span></button>
</div>
</form>{{end}}

{{define "assistantInput"}}<div data-assistant-input>
{{if .ReadOnly}}{{template "assistantReadOnly" .ReadOnly}}{{else}}{{template "assistantComposer" .}}{{end}}
</div><template data-assistant-expired>{{template "assistantReadOnly" "Cette conversation est terminée. Ouvre une nouvelle conversation pour poursuivre."}}</template>{{end}}

{{define "assistantReadOnly"}}<div class="rounded-box border border-base-300 bg-base-300/40 p-4" role="status">
<p class="text-sm text-base-content/80">{{.}}</p><a class="btn btn-outline mt-3 min-h-11" href="/assistant?nouvelle=1">Ouvrir une nouvelle conversation</a>
</div>{{end}}

{{define "assistantHistory"}}<nav aria-label="Conversations récentes">
<h2 class="px-2 text-sm font-semibold text-primary">Conversations récentes</h2>
<p class="px-2 pt-1 pb-3 text-xs text-base-content/70">Historique privé · 7 jours</p>
<ol class="flex max-h-[60dvh] flex-col gap-1 overflow-y-auto">{{range .Items}}<li><a class="block min-h-11 rounded-box px-2 py-3 hover:bg-base-200 focus-visible:outline-2 focus-visible:outline-primary {{if eq .ID $.Selected}}bg-base-200 font-semibold{{end}}" href="/assistant/{{.ID}}" {{if eq .ID $.Selected}}aria-current="page"{{end}} title="{{.Title}}"><span class="block truncate text-sm">{{.Title}}</span><span class="block pt-1 text-xs font-normal text-base-content/70">{{formatTime .Seen}}{{if not .CanResume}} · Lecture seule{{end}}</span></a></li>{{else}}<li class="px-2 py-3 text-sm text-base-content/70">Tes conversations apparaîtront ici.</li>{{end}}</ol>
{{if or .Previous .Next}}<div class="mt-2 flex flex-wrap justify-between gap-2 border-t border-base-300 pt-2">{{with .Previous}}<a class="link min-h-11 py-3 text-sm" href="{{.}}">Plus récentes</a>{{end}}{{with .Next}}<a class="link min-h-11 py-3 text-sm" href="{{.}}">Plus anciennes</a>{{end}}</div>{{end}}
</nav>{{end}}
