{{define "main"}}
{{$d := .Data}}
<h1 class="text-2xl font-bold text-primary">{{$d.Heading}}</h1>
<div class="panel mt-6 max-w-xl border-primary p-6">
<p class="select-all text-3xl font-semibold tracking-wide break-all text-primary tabular-nums">{{$d.Password}}</p>
<p class="mt-4">Transmets-le de vive voix ou par message. Il ne sera plus affiché.</p>
<p class="mt-1 text-sm">Les tirets font partie du mot de passe.</p>
<dl class="mt-4 grid grid-cols-[auto_1fr] gap-x-3 gap-y-1">
<dt class="font-semibold">Identifiant</dt><dd>{{$d.Username}}</dd>
<dt class="font-semibold">Adresse</dt><dd class="break-all">{{$d.SignInURL}}</dd>
</dl>
</div>
<p class="mt-6"><a class="btn btn-outline min-h-11" href="/comptes">Retour aux comptes</a></p>
{{end}}
