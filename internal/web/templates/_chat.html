{{define "committeeChat"}}<aside class="committee-chat" data-chat data-chat-session="{{.CSRF}}" data-chat-user="{{.Account.Username}}" aria-label="Chat du comité">
<button type="button" class="chat-launcher" data-chat-toggle aria-controls="committee-chat-panel" aria-expanded="false">
<svg class="size-5" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2V11.5a9.5 9.5 0 0 1 19 0Z"/><path d="M7 10h10M7 14h6"/></svg>
<span>Chat comité</span><span class="chat-online" data-chat-count>0 connecté</span><span class="chat-unread" data-chat-badge hidden>0</span>
</button>
<section id="committee-chat-panel" class="chat-panel" data-chat-panel aria-label="Salon commun du comité" hidden>
<header class="chat-header"><div><h2 class="font-bold">Chat comité</h2><p class="text-xs opacity-80">Un petit mot entre nous</p></div><div class="flex items-center gap-1">
<button type="button" class="chat-icon" data-chat-mute aria-label="Son du chat" aria-pressed="false" title="Couper le son">{{template "icon" "bell"}}</button>
<button type="button" class="chat-icon" data-chat-close aria-label="Réduire le chat" title="Réduire"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 12h12"/></svg></button>
</div></header>
<div class="chat-people" data-chat-people aria-label="Opérateurs connectés"></div>
<p class="chat-status" data-chat-status role="status">Connexion au salon…</p>
<p class="chat-warning" data-chat-warning role="status" hidden></p>
<div class="chat-log" data-chat-log role="log" aria-label="Messages du comité" aria-live="off" tabindex="0"><p class="chat-empty" data-chat-empty>Le salon est ouvert.<br>Les petits mots arrivent ici.</p></div>
<button type="button" class="chat-jump" data-chat-jump hidden>Nouveaux messages ↓</button>
<form class="chat-compose" data-chat-form>
<label class="sr-only" for="committee-chat-text">Ton message au comité</label>
<textarea id="committee-chat-text" class="textarea w-full" name="chat-text" rows="2" data-chat-text placeholder="Un petit mot au comité…" aria-describedby="committee-chat-help"></textarea>
<div class="flex items-center justify-between gap-2"><p id="committee-chat-help" class="text-xs">Entrée pour envoyer · Maj+Entrée pour une ligne</p><button type="submit" class="btn btn-primary btn-sm min-h-11" data-chat-send disabled>Envoyer</button></div>
</form>
<p class="sr-only" data-chat-announcement aria-live="polite" aria-atomic="true"></p>
</section></aside>{{end}}
