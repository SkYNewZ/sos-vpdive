# Example deployment. Copy .env.example to .env and fill it in; write
# admins.yaml from admins.example.yaml (see README). A new named volume takes
# the ownership of /data from the image (uid 65532).
services:
  app:
    build: .
    image: sos-vpdive:local
    env_file: .env
    ports:
      # The reverse proxy on this host is the only entry point.
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/data
      - ./admins.yaml:/config/admins.yaml:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The server's graceful shutdown waits up to 30 s; Docker's default is 10 s.
    stop_grace_period: 35s
    restart: unless-stopped

volumes:
  data:
