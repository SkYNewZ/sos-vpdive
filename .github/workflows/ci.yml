name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint and test run side by side: go test -race is the long pole.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Forbidden files
        run: ./scripts/check-forbidden-files.sh
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
      - name: Validate the fiches
        run: go run ./cmd/sos-vpdive validate-kb

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race ./...

  # Only what gets published is built: develop as :latest, a tag vX.Y.Z as
  # :X.Y.Z.
  image:
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-24.04
    env:
      IMAGE: skynewz/sos-vpdive
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # git describe needs the tags
          persist-credentials: false
      - name: Image tag and version
        id: meta
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) tag=${GITHUB_REF_NAME#v} ;;
            *) tag=latest ;;
          esac
          echo "tag=$IMAGE:$tag" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: skynewz
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build and push the image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
