  - name: ChatGPT-User
  - name: OAI-SearchBot
  - name: ClaudeBot
  - name: Claude-User
  - name: Claude-SearchBot
  - name: anthropic-ai
  - name: CCBot
  - name: PerplexityBot
  - name: Perplexity-User
  - name: Bytespider
  - name: Amazonbot
  - name: meta-externalagent
  - name: Meta-ExternalFetcher
  - name: FacebookBot
  - name: Diffbot
  - name: cohere-ai
  - name: cohere-training-data-crawler
  - name: MistralAI-User
  - name: DuckAssistBot
  - name: YouBot
  - name: Timpibot
  - name: ImagesiftBot
  - name: Google-Extended
    robots_txt_only: true
  - name: Applebot-Extended
    robots_txt_only: true
