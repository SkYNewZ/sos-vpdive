<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 742" role="img" aria-labelledby="titre desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="titre">Connexion d'une application au serveur MCP du comité</title>
<desc id="desc">L'application reçoit un 401, lit les métadonnées OAuth, ouvre l'écran d'autorisation au membre du comité, échange le code contre des jetons, puis appelle les outils en lecture seule.</desc>
<style>
.bg{fill:#ffffff}
.lane{stroke:#c9ced6;stroke-width:1.5;stroke-dasharray:4 6}
.box{fill:#eef3fb;stroke:#2f5fa8;stroke-width:1.5}
.head{fill:#16325c;font-size:17px;font-weight:600;text-anchor:middle}
.msg{fill:#1f2933;font-size:14px}
.num{fill:#ffffff;font-size:12px;font-weight:700;text-anchor:middle}
.dot{fill:#2f5fa8}
.call{stroke:#2f5fa8;stroke-width:2;fill:none;marker-end:url(#fleche)}
.back{stroke:#5b6b7c;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#retour)}
.tip{fill:#2f5fa8}
.tipback{fill:#5b6b7c}
@media (prefers-color-scheme: dark){
.bg{fill:#11161d}
.lane{stroke:#3b4654}
.box{fill:#1b2a41;stroke:#7fa8e6}
.head{fill:#dbe7fb}
.msg{fill:#e6eaf0}
.dot,.tip{fill:#7fa8e6}
.num{fill:#11161d}
.call{stroke:#7fa8e6}
.back{stroke:#9aa7b6}
.tipback{fill:#9aa7b6}
}
</style>
<defs>
<marker id="fleche" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path class="tip" d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="retour" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path class="tipback" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
<rect class="bg" width="1080" height="742"/>
<line class="lane" x1="170" y1="74" x2="170" y2="728"/>
<rect class="box" x="60" y="22" width="220" height="52" rx="10"/>
<text class="head" x="170" y="54">Claude ou ChatGPT</text>
<line class="lane" x1="570" y1="74" x2="570" y2="728"/>
<rect class="box" x="460" y="22" width="220" height="52" rx="10"/>
<text class="head" x="570" y="54">App Comité</text>
<line class="lane" x1="910" y1="74" x2="910" y2="728"/>
<rect class="box" x="800" y="22" width="220" height="52" rx="10"/>
<text class="head" x="910" y="54">Membre du comité</text>
<circle class="dot" cx="192" cy="113" r="10"/>
<text class="num" x="192" y="117">1</text>
<text class="msg" x="210" y="118">POST /mcp, sans jeton</text>
<line class="call" x1="170" y1="132" x2="564" y2="132"/>
<circle class="dot" cx="192" cy="167" r="10"/>
<text class="num" x="192" y="171">2</text>
<text class="msg" x="210" y="172">401 + WWW-Authenticate: resource_metadata</text>
<line class="back" x1="570" y1="186" x2="176" y2="186"/>
<circle class="dot" cx="192" cy="221" r="10"/>
<text class="num" x="192" y="225">3</text>
<text class="msg" x="210" y="226">GET des deux documents /.well-known/oauth-*</text>
<line class="call" x1="170" y1="240" x2="564" y2="240"/>
<circle class="dot" cx="192" cy="275" r="10"/>
<text class="num" x="192" y="279">4</text>
<text class="msg" x="210" y="280">ouvre /oauth/authorize dans le navigateur (client_id, PKCE S256)</text>
<line class="call" x1="170" y1="294" x2="904" y2="294"/>
<circle class="dot" cx="192" cy="329" r="10"/>
<text class="num" x="192" y="333">5</text>
<text class="msg" x="210" y="334">GET du document client, sur un hôte autorisé</text>
<line class="call" x1="570" y1="348" x2="176" y2="348"/>
<circle class="dot" cx="592" cy="383" r="10"/>
<text class="num" x="592" y="387">6</text>
<text class="msg" x="610" y="388">connexion si besoin, puis « Autoriser »</text>
<line class="call" x1="910" y1="402" x2="576" y2="402"/>
<circle class="dot" cx="192" cy="437" r="10"/>
<text class="num" x="192" y="441">7</text>
<text class="msg" x="210" y="442">retour vers redirect_uri : code, state, iss</text>
<line class="back" x1="570" y1="456" x2="176" y2="456"/>
<circle class="dot" cx="192" cy="491" r="10"/>
<text class="num" x="192" y="495">8</text>
<text class="msg" x="210" y="496">POST /oauth/token : code + code_verifier</text>
<line class="call" x1="170" y1="510" x2="564" y2="510"/>
<circle class="dot" cx="192" cy="545" r="10"/>
<text class="num" x="192" y="549">9</text>
<text class="msg" x="210" y="550">jeton d'accès (1 h) + rafraîchissement (30 j)</text>
<line class="back" x1="570" y1="564" x2="176" y2="564"/>
<circle class="dot" cx="192" cy="599" r="10"/>
<text class="num" x="192" y="603">10</text>
<text class="msg" x="210" y="604">POST /mcp + Bearer : tools/list, tools/call</text>
<line class="call" x1="170" y1="618" x2="564" y2="618"/>
<circle class="dot" cx="192" cy="653" r="10"/>
<text class="num" x="192" y="657">11</text>
<text class="msg" x="210" y="658">résultats en JSON, téléphones et IBAN masqués</text>
<line class="back" x1="570" y1="672" x2="176" y2="672"/>
</svg>
